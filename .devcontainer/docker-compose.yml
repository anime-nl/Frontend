x-dev-publishable-key: &publishable-key pk_local_dev_0000000000000000000000000000000000000000000000000000

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/animenl-website:cached
    extra_hosts:
      - host.docker.internal:host-gateway
    # Starting the app service also starts the whole Medusa stack (medusa pulls in postgres and seaweedfs)
    depends_on:
      medusa:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      # Browser-facing URL. *.localhost always resolves to loopback inside a container,
      # so the Nuxt server uses MEDUSA_SERVER_URL (the compose service name) instead.
      MEDUSA_URL: http://medusa.localhost:9000/
      MEDUSA_SERVER_URL: http://medusa:9000/
      MEDUSA_PUBLISHABLE_KEY: *publishable-key
      MEDUSA_SALES_CHANNEL_ID: ""
      # Emails are caught by mailpit instead of being sent
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"

  # Catches the emails the site sends, inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  medusa:
    build:
      context: .
      dockerfile: medusa.Dockerfile
    command: sh ./start.sh
    volumes:
      - ../medusa:/app
      - medusa_node_modules:/app/node_modules
    ports:
      - "9000:9000"
    networks:
      default:
        aliases:
          - medusa.localhost
    environment:
      # sslmode=disable: Medusa forces SSL for any host other than localhost, and this postgres has none
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000,http://medusa.localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000,http://medusa.localhost:9000
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      PUBLISHABLE_API_KEY: *publishable-key
      S3_FILE_URL: http://localhost:9200/medusa
      S3_ENDPOINT: http://seaweedfs:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: medusa
      ADMIN_EMAIL: admin@animenl.local
      ADMIN_PASSWORD: supersecret
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. Runs without an identities config, so any credentials are accepted and
  # anonymous reads work. Buckets are not created automatically: medusa/start.sh creates one.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -s3 -s3.port=9000 -dir=/data
    ports:
      - "9200:9000"
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data:
  medusa_node_modules:

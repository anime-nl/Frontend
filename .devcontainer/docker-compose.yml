x-dev-publishable-key: &publishable-key pk_local_dev_0000000000000000000000000000000000000000000000000000

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/animenl-website:cached
    extra_hosts:
      - host.docker.internal:host-gateway
    # Starting the app service also starts the whole Medusa stack (medusa pulls in postgres and seaweedfs)
    depends_on:
      medusa:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      # Browser-facing URL. *.localhost always resolves to loopback inside a container,
      # so the Nuxt server uses MEDUSA_SERVER_URL (the compose service name) instead.
      MEDUSA_URL: http://medusa.localhost:9000/
      MEDUSA_SERVER_URL: http://medusa:9000/
      MEDUSA_PUBLISHABLE_KEY: *publishable-key
      MEDUSA_SALES_CHANNEL_ID: ''
      # Emails are caught by mailpit instead of being sent
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      # Signs order page links; must match Medusa's ORDER_LINK_SECRET below. Dev-only value.
      ORDER_LINK_SECRET: dev-order-link-secret

  # Catches the emails the site sends, inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit
    ports:
      - '8025:8025'

  medusa:
    build:
      context: .
      dockerfile: medusa.Dockerfile
    command: sh ./dev/start.sh
    volumes:
      - ../medusa:/app
      - medusa_node_modules:/app/node_modules
    ports:
      - '9000:9000'
    networks:
      default:
        aliases:
          - medusa.localhost
    environment:
      # sslmode=disable: Medusa forces SSL for any host other than localhost, and this postgres has none
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa?sslmode=disable
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000,http://medusa.localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000,http://medusa.localhost:9000
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      PUBLISHABLE_API_KEY: *publishable-key
      # Production stores files in MinIO, so its config reads MINIO_*; SeaweedFS speaks the same S3 API.
      # MINIO_FILE_URL is the address the browser uses, MINIO_ENDPOINT the one Medusa uploads to.
      MINIO_ENDPOINT: http://seaweedfs:9000
      MINIO_FILE_URL: http://localhost:9200/medusa
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: medusa
      REDIS_URL: redis://redis:6379
      ADMIN_EMAIL: admin@animenl.local
      ADMIN_PASSWORD: supersecret
      # From .devcontainer/.env (not committed; see .devcontainer/.env.example)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: http://localhost:3000/account/callback/google
      MOLLIE_API_KEY: ${MOLLIE_API_KEY}
      MOLLIE_REDIRECT_URL: http://localhost:3000/checkout/return
      MEDUSA_URL: http://localhost:9000
      # Order confirmation emails are caught by mailpit; links point at the local storefront
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      STOREFRONT_URL: http://localhost:3000
      ORDER_LINK_SECRET: dev-order-link-secret
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  # Production's Medusa uses Redis for its cache, event bus and workflow engine
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medusa -d medusa']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible storage. Runs without an identities config, so any credentials are accepted and
  # anonymous reads work. Buckets are not created automatically: medusa/dev/start.sh creates one.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: server -s3 -s3.port=9000 -dir=/data
    ports:
      - '9200:9000'
    volumes:
      - seaweedfs_data:/data

volumes:
  postgres_data:
  seaweedfs_data:
  medusa_node_modules:

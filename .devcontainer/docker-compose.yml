x-dev-publishable-key: &publishable-key pk_local_dev_0000000000000000000000000000000000000000000000000000
x-minio-image: &minio-image minio/minio:RELEASE.2025-04-22T22-12-26Z

services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/animenl-website:cached
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      MEDUSA_URL: http://medusa.localhost:9000/
      MEDUSA_PUBLISHABLE_KEY: *publishable-key
      MEDUSA_SALES_CHANNEL_ID: ""

  medusa:
    build:
      context: .
      dockerfile: medusa.Dockerfile
    command: sh ./start.sh
    volumes:
      - ../medusa:/app
      - medusa_node_modules:/app/node_modules
    ports:
      - "9000:9000"
    networks:
      default:
        aliases:
          - medusa.localhost
    environment:
      DATABASE_URL: postgres://medusa:medusa@postgres:5432/medusa
      STORE_CORS: http://localhost:3000
      ADMIN_CORS: http://localhost:9000,http://medusa.localhost:9000
      AUTH_CORS: http://localhost:3000,http://localhost:9000,http://medusa.localhost:9000
      JWT_SECRET: supersecret
      COOKIE_SECRET: supersecret
      PUBLISHABLE_API_KEY: *publishable-key
      S3_FILE_URL: http://localhost:9100/medusa
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: medusa
      ADMIN_EMAIL: admin@animenl.local
      ADMIN_PASSWORD: supersecret
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d medusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: *minio-image
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"
      - "9101:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/medusa &&
        mc anonymous set download local/medusa

volumes:
  postgres_data:
  minio_data:
  medusa_node_modules:
